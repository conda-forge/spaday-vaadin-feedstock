context:
  version: "0.2.0"

package:
  name: spaday-vaadin
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/spaday-vaadin/spaday_vaadin-${{ version }}.tar.gz
  sha256: a4e2595cba82e301b0d0a459850c4ebf51852b0acd17515df123cee0d4496ae6

build:
  number: 0
  noarch: python
  script:
    env:
      SKIP_HATCH_JS: "1"
    content:
      - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-js
  run:
    - python >=${{ python_min }}
    - spaday >=0.8.2,<1

tests:
  - python:
      imports:
        - spaday_vaadin
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: Vaadin components and browser assets for spaday
  homepage: https://github.com/1kbgz/spaday-vaadin
  repository: https://github.com/1kbgz/spaday-vaadin

extra:
  recipe-maintainers:
    - timkpaine
